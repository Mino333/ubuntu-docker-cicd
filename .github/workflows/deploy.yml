name: Build and deploy Nginx

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          test -s index.html
          grep -q "<html" index.html
          grep -q "</html>" index.html
          echo "HTML validation successful"

      - name: Build and deploy Nginx
        run: |
          docker compose up -d --build

      - name: Verify deployment
        run: |
          for i in {1..10}; do
          if curl --fail http://127.0.0.1:8080; then
          echo "Deployment successful"
          exit 0
          fi
          echo "Waiting for application..."
          sleep 3
          done

          echo "Deployment failed"
          docker logs cicd-demo
          exit 1
