name: Build and deploy Nginx

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: [self-hosted,mint-laptop]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          test -s index.html
          grep -q "<html" index.html
          grep -q "</html>" index.html
          echo "HTML validation successful"

      - name: Build and deploy Nginx
        run: |
          docker compose up -d --build

      - name: Verify deployment
        run: |
          docker ps
          curl --fail http://localhost:8080
          echo "Deployment successful"
